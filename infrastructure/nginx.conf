upstream relayops_api {
    server api:8000;
    keepalive 16;
}

# Preserve a client supplied X-Request-ID, otherwise generate one. The same
# value is sent upstream and returned to the client.
map $http_x_request_id $relayops_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    # The API contract accepts payloads up to 1 MB. The extra headroom covers
    # the JSON envelope (event_id, type, payload keys) around the payload.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $relayops_request_id;

    # Avoid duplicating the header that the API already sets.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $relayops_request_id always;

    location / {
        proxy_pass http://relayops_api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}