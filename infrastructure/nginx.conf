upstream relayops_api {
    server api:8000;
    keepalive 16;
}

# Keep a client-provided request id; otherwise use nginx's generated one.
# The same value goes upstream and back to the client.
map $http_x_request_id $relayops_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    # The contract allows 1 MB payloads. 2m leaves room for the JSON envelope.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $relayops_request_id;

    # The API already returns this header; don't send it twice.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $relayops_request_id always;

    location / {
        proxy_pass http://relayops_api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}