name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit/database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops
          POSTGRES_DB: relayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELAYOPS_TEST_DATABASE_URL: postgresql://relayops:relayops@localhost:5432/relayops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            worker/requirements.txt
            tests/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Run unit, worker, and database tests
        run: pytest -m "not integration" -v

  integration:
    name: Docker Compose integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run integration tests
        env:
          RELAYOPS_BASE_URL: http://localhost:8080
          RELAYOPS_RECEIVER_URL: http://localhost:9000
        run: pytest -m integration -v

      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Shut down
        if: always()
        run: docker compose down -v